name: student_management
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.8.1

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  async: ^2.13.0
  bot_toast: ^4.1.3
  cached_network_image:
  carousel_slider: ^5.1.1
  connectivity_plus: ^6.1.5
  crypto: ^3.0.6
  cupertino_icons: ^1.0.8
  device_info_plus: ^11.5.0
  dio: ^5.9.0
  equatable: ^2.0.5
  firebase_analytics: ^12.0.1
  firebase_core: ^4.1.0
  firebase_crashlytics: ^5.0.1
  firebase_messaging: ^16.0.1
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^9.2.4
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.2.1
  font_awesome_flutter: ^10.10.0
  get_it: ^8.2.0
  go_router: ^16.2.1
  google_fonts: ^6.3.1
  hive_flutter: ^1.1.0
  image_picker: ^1.2.0
  injectable: ^2.1.2
  intl: ^0.20.2
  internet_connection_checker_plus:
  logger: ^2.6.1
  lottie: ^3.3.1
  network_logger:
  package_info_plus: ^8.3.1
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  rename_app: ^1.6.5
  provider: ^6.1.2

  # Notifications
  awesome_notifications: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner:
  hive_generator:
  injectable_generator:
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.6
  flutter_lints: ^5.0.0
  asset_generator:
  mockito: ^5.4.4
  flutter_flavorizr: ^2.2.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false
  linux:
    generate: false

asset_generator:
  images:
    - assets/images/no_internet/
    - assets/images/login/
    - assets/images/backgrounds/
    - assets/images/app_build_image/
  output: lib/generated/generated_images.dart
  class_name: AppAssets

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/logo.png
    - assets/images/logo.webp
    - assets/images/no_internet/
    - assets/images/login/
    - assets/images/backgrounds/
    - assets/env/

flavorizr:
  app:
    android:
      flavorDimensions: "app"
    ios: {}

  flavors:
    dev:
      app:
        name: "School Connect Dev"
      android:
        applicationId: "com.student.connect.student_management.dev"
      ios:
        bundleId: "com.student.connect.studentManagement.dev"

    prod:
      app:
        name: "School Connect"
      android:
        applicationId: "com.student.connect.student_management"
      ios:
        bundleId: "com.student.connect.studentManagement"
name: Manual Deploy (Android -> Google Drive)

on:
  workflow_dispatch:
    inputs:
      flutter_channel:
        description: Flutter channel
        required: false
        default: stable
      build_flavor:
        description: Optional Flutter flavor (leave empty if none)
        required: false
        default: ""

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ github.event.inputs.flutter_channel || 'stable' }}

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Build APK (release)
        run: |
          if [ -n "${{ github.event.inputs.build_flavor }}" ]; then
            flutter build apk --release --flavor "${{ github.event.inputs.build_flavor }}"
          else
            flutter build apk --release
          fi

      - name: Locate APK
        id: locate_apk
        run: |
          # Common Flutter APK output path
          DEFAULT_APK="build/app/outputs/flutter-apk/app-release.apk"
          if [ -f "$DEFAULT_APK" ]; then
            echo "apk_path=$DEFAULT_APK" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Fallbacks (flavor-specific or variant changes)
          CANDIDATES=$(ls -1 build/app/outputs/flutter-apk/*.apk 2>/dev/null || true)
          if [ -n "$CANDIDATES" ]; then
            # pick the most recent apk
            APK=$(ls -t build/app/outputs/flutter-apk/*.apk | head -n1)
            echo "apk_path=$APK" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "No APK found" >&2
          exit 1

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ steps.locate_apk.outputs.apk_path }}

      - name: Install rclone
        run: |
          sudo apt-get update -y
          sudo apt-get install -y rclone

      - name: Configure rclone
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONF }}" > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf

      - name: Upload to Google Drive via rclone
        if: ${{ secrets.RCLONE_REMOTE_PATH != '' }}
        run: |
          rclone copy "${{ steps.locate_apk.outputs.apk_path }}" "${{ secrets.RCLONE_REMOTE_PATH }}" -P


